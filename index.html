function dynamicFields(){const d=COPY[currentLang];const dest=$('#dynamicFields');dest.replaceChildren();const keys=({2:['orderNo','business'],3:['account'],4:['orderNo','payment'],5:['device'],6:['suggestName','suggestCity','suggestLink']})[currentTopic]||[];keys.forEach(key=>{const lab=document.createElement('label');lab.className='field';const sp=document.createElement('span');sp.textContent=d.extra[key];const inp=document.createElement('input');inp.type='text';inp.name=key;inp.maxLength=150;lab.append(sp,inp);dest.append(lab)});dest.style.display=keys.length?'grid':'none';dest.style.gridTemplateColumns=keys.length>1?'repeat(2,minmax(0,1fr))':'1fr';dest.style.gap='14px'}
function language(next){if(!COPY[next])return;currentLang=next;const doc=document.documentElement;doc.lang=next;doc.dir=next==='en'?'ltr':'rtl';document.body.lang=next;$('#language').value=next;$$('[data-t]').forEach(el=>{const v=COPY[next][el.dataset.t];if(typeof v==='string')el.textContent=v});$$('[data-html]').forEach(el=>{if(el.dataset.html==='headline')el.innerHTML=COPY[next].headline});const sel=$('#topic');sel.replaceChildren();COPY[next].topics.forEach((s,i)=>{const opt=document.createElement('option');opt.value=String(i);opt.textContent=s;sel.append(opt)});sel.value=String(currentTopic);dynamicFields();makeRibbon();setMode(currentMode,true);$('#formFeedback').textContent='';document.title='ChekChak — '+({he:'הכול מסביבכם',ar:'كل اللي حواليك',en:'Everything Around You'})[next]}
function toast(msg){const box=$('#toast');box.textContent=msg;box.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),3400)}
$('#language').addEventListener('change',e=>language(e.target.value));
$('#menuButton').addEventListener('click',()=>{const nav=$('#siteNav');const visible=nav.classList.toggle('open');$('#menuButton').setAttribute('aria-expanded',String(visible))});$$('#siteNav a').forEach(a=>a.addEventListener('click',()=>{$('#siteNav').classList.remove('open');$('#menuButton').setAttribute('aria-expanded','false')}));
$$('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));$('#phoneTabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const index=TABS.indexOf(currentMode);const next=e.key==='Home'?0:e.key==='End'?2:(index+(e.key==='ArrowRight'?1:2))%3;e.preventDefault();setMode(TABS[next]);$('#tab-'+TABS[next]).focus()});
$('#topic').addEventListener('change',e=>{currentTopic=Number(e.target.value);dynamicFields()});
$('#contactForm').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget;$('#formFeedback').textContent='';if(Number($('#topic').value)===0){$('#formFeedback').textContent=COPY[currentLang].fillRequired;$('#topic').focus();return}if(!form.checkValidity()){form.reportValidity();return}$('#formFeedback').textContent=COPY[currentLang].notSent});
$('#headerDownload').addEventListener('click',()=>document.getElementById('app-download').scrollIntoView({behavior:'smooth',block:'start'}));$$('[data-app-button]').forEach(btn=>btn.addEventListener('click',()=>document.getElementById('app-download').scrollIntoView({behavior:'smooth',block:'start'})));
const observer='IntersectionObserver' in window?new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');observer.unobserve(e.target)}}),{threshold:.07}):null;$$('.reveal').forEach(el=>{if(observer)observer.observe(el);else el.classList.add('in')});language('he');
</script>

<script>
/* Keep the visual label synchronized with the native language select. */
(function(){
 const select=document.querySelector('.language-switch #language');
 const current=document.querySelector('.language-switch .language-current');
 if(!select||!current)return;
 function syncLanguageLabel(){
   const option=select.options[select.selectedIndex];
   if(!option)return;
   current.textContent=option.textContent;
   current.setAttribute('lang',select.value);
   current.setAttribute('dir',select.value==='en'?'ltr':'rtl');
 }
 select.addEventListener('change',syncLanguageLabel);
 syncLanguageLabel();
})();
</script>
